# Optional evaluated 7B profile; complete explicit local setup before enabling.
x-local-ai: &local-ai
  MLPP_CHAT_BACKEND: ollama
  MLPP_CHAT_ENABLED: "true"
  MLPP_CHAT_PROTOCOL: guided
  MLPP_CHAT_MODEL: mlpp-qwen2.5:7b-instruct-q4_K_M-json-tools-v1
  MLPP_CHAT_MODEL_ORIGIN: http://host.docker.internal:11434
  MLPP_CHAT_TOKENIZER_PATH: /app/.tools/local-model-setup/tokenizer.json
  MLPP_CHAT_API_ORIGIN: http://api:8000
services:
  model-api:
    environment:
      <<: *local-ai
    volumes:
      - ./.tools/local-model-setup/tokenizer.json:/app/.tools/local-model-setup/tokenizer.json:ro
  monitoring-api:
    environment:
      <<: *local-ai
    volumes:
      - ./.tools/local-model-setup/tokenizer.json:/app/.tools/local-model-setup/tokenizer.json:ro
