[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-pipeline-pro"
version = "0.1.0"
description = "Reproducible ML experiments and AI-assisted pipeline management."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.13,<5",
    "redis>=5,<8",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline_pro"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires real MongoDB and Redis (set MLPP_RUN_INTEGRATION=1)"]

[tool.coverage.run]
source = ["ml_pipeline_pro"]
branch = true

[tool.coverage.report]
show_missing = true
