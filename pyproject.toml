[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-pipeline-pro"
version = "0.1.0"
description = "Reproducible ML experiments and AI-assisted pipeline management."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "celery[redis]>=5.5,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langsmith>=0.14,<1",
    "prometheus-client>=0.23,<0.25",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.13,<5",
    "redis>=5,<8",
    "tokenizers>=0.22.2,<0.23",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
training = ["numpy>=2,<3", "optuna>=4.6,<6", "torch>=2.8,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline_pro"]

[tool.hatch.build.targets.sdist]
exclude = ["/.tools/**", "/.venv/**", "/.cache/**", "/.uv-cache/**", "/artifacts/**"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real MongoDB and Redis (set MLPP_RUN_INTEGRATION=1)",
    "recovery: stops services in a disposable Compose stack (set MLPP_RUN_RECOVERY_INTEGRATION=1)",
    "local_model_eval: opt-in installed local-model evaluation, outside ordinary test discovery",
]

[tool.coverage.run]
source = ["ml_pipeline_pro"]
branch = true

[tool.coverage.report]
show_missing = true
