global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: mlpp-workload
    metrics_path: /api/v1/monitoring/metrics
    http_headers:
      X-Project-ID:
        values: [demo]
    static_configs:
      - targets: [monitoring-api:8000]
