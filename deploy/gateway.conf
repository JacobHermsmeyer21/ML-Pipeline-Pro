events {}

http {
    # Docker's internal DNS allows domain containers to be replaced independently.
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_x_correlation_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_correlation_id;
    }
    server {
        listen 8000;
        client_max_body_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_hide_header X-Correlation-ID;
        add_header X-Correlation-ID $correlation_id always;
        # Never retry a mutation at the proxy boundary.
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 130s;
        error_page 502 504 =503 /gateway-unavailable;
        location = /gateway-unavailable {
            internal;
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"Domain service is unavailable","correlation_id":"$correlation_id"}}';
        }
        location ~ ^/api/v1/tuning-jobs(/|$) {
            set $tuning_backend http://tuning-api:8000;
            proxy_pass $tuning_backend;
        }
        location /tuning/ {
            set $tuning_backend http://tuning-api:8000;
            proxy_pass $tuning_backend;
        }
        location ~ ^/api/v1/monitoring(/|$) {
            set $monitoring_backend http://monitoring-api:8000;
            proxy_pass $monitoring_backend;
        }
        location /monitoring/ {
            set $monitoring_backend http://monitoring-api:8000;
            proxy_pass $monitoring_backend;
        }
        location / {
            set $model_backend http://model-api:8000;
            proxy_pass $model_backend;
        }
    }
}
