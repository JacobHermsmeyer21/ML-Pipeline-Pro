name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra training
      - run: uv run --locked --extra training ruff check .
      - run: uv run --locked --extra training ruff format --check .
      - run: uv run --locked --extra training pytest -m "not integration" --cov --cov-report=term-missing --junitxml=artifacts/test-reports/unit.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-validation-python-${{ matrix.python-version }}
          path: artifacts/test-reports/unit.xml
      - run: uv pip check
      - if: matrix.python-version == '3.11'
        run: |
          uv export --locked --extra training --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uv run --locked --extra training pip-audit -r /tmp/requirements.txt --require-hashes --disable-pip
          # PyPI's advisory service cannot look up the CPU build suffix. Audit its release too.
          uv run --locked --extra training python -c 'from importlib.metadata import version; from pathlib import Path; Path("/tmp/torch-audit.txt").write_text("torch==" + version("torch").split("+")[0] + "\n")'
          uv run --locked --extra training pip-audit -r /tmp/torch-audit.txt --no-deps --disable-pip

  domain-compose-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra training
      - run: docker compose -f compose.yaml -f compose.services.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.services.yaml up --build --wait --wait-timeout 300
      - run: uv run --locked --extra training python scripts/check_domain_routes.py --output artifacts/domain-validation/routes.json
      - run: uv run --locked --extra training pytest -m "integration and not recovery" --junitxml=artifacts/domain-validation/integration.xml
        env:
          MLPP_RUN_INTEGRATION: "1"
          MLPP_RUN_WORKER_INTEGRATION: "1"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domain-service-validation
          path: artifacts/domain-validation/
      - if: failure()
        run: docker compose -f compose.yaml -f compose.services.yaml logs
      - if: always()
        run: docker compose -f compose.yaml -f compose.services.yaml down

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra training
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 300
      - run: curl --fail http://127.0.0.1:8000/api/v1/health/ready
      - run: uv run --locked --extra training pytest -m "integration and not recovery" --junitxml=artifacts/test-reports/integration.xml
        env:
          MLPP_RUN_INTEGRATION: "1"
          MLPP_RUN_WORKER_INTEGRATION: "1"
      - run: uv run --locked --extra training pytest -m recovery --junitxml=artifacts/recovery-validation/junit.xml
        env:
          MLPP_RUN_RECOVERY_INTEGRATION: "1"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-integration-validation
          path: artifacts/test-reports/integration.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-validation
          path: artifacts/recovery-validation/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
