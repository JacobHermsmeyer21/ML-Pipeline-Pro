name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # MongoDB jobs need a compatible host kernel: https://jira.mongodb.org/browse/SERVER-121912
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra training
      - run: uv run --locked --extra training ruff check .
      - run: uv run --locked --extra training ruff format --check .
      - run: uv run --locked --extra training pytest -m "not integration" --cov --cov-report=term-missing --junitxml=artifacts/test-reports/unit.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-validation-python-${{ matrix.python-version }}
          path: artifacts/test-reports/unit.xml
      - run: uv pip check
      - if: matrix.python-version == '3.11'
        run: |
          uv export --locked --extra training --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uv run --locked --extra training pip-audit -r /tmp/requirements.txt --require-hashes --disable-pip
          # PyPI's advisory service cannot look up the CPU build suffix. Audit its release too.
          uv run --locked --extra training python -c 'from importlib.metadata import version; from pathlib import Path; Path("/tmp/torch-audit.txt").write_text("torch==" + version("torch").split("+")[0] + "\n")'
          uv run --locked --extra training pip-audit -r /tmp/torch-audit.txt --no-deps --disable-pip

  domain-compose-smoke:
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - name: Record runner kernel
        run: uname -r
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra training
      - run: docker compose -f compose.yaml -f compose.services.yaml -f compose.monitoring.yaml -f compose.dashboard.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.services.yaml -f compose.monitoring.yaml -f compose.dashboard.yaml up --build --wait --wait-timeout 300
      - run: uv run --locked --extra training python scripts/check_domain_routes.py --output artifacts/domain-validation/routes.json
      - run: uv run --locked --extra training python scripts/deployment_smoke.py --output artifacts/domain-validation/smoke.json
      - run: uv run --locked --extra training pytest -m "integration and not recovery" --junitxml=artifacts/domain-validation/integration.xml
        env:
          MLPP_RUN_INTEGRATION: "1"
          MLPP_RUN_WORKER_INTEGRATION: "1"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domain-service-validation
          path: artifacts/domain-validation/
      - if: failure()
        run: docker compose -f compose.yaml -f compose.services.yaml -f compose.monitoring.yaml -f compose.dashboard.yaml logs
      - if: always()
        run: docker compose -f compose.yaml -f compose.services.yaml -f compose.monitoring.yaml -f compose.dashboard.yaml down

  kubernetes-deploy:
    runs-on: ubuntu-22.04
    needs: checks
    steps:
      - name: Record runner kernel
        run: uname -r
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra training
      - name: Install verified kind
        run: |
          curl --fail --location --output /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl --fail --location --output /tmp/kind.sha256sum https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum
          echo "$(awk '{print $1}' /tmp/kind.sha256sum)  /tmp/kind" | sha256sum --check
          chmod +x /tmp/kind
      - run: docker build -t ml-pipeline-pro:midterm .
      - run: uv run --locked --extra training python scripts/deploy_kind.py --kind /tmp/kind --name mlpp-ci --cleanup
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-deployment-validation
          path: |
            artifacts/kubernetes-validation/*.json
            artifacts/kubernetes-validation/*.log
            artifacts/kubernetes-validation/replicas/*.json
            artifacts/kubernetes-validation/replicas/*.log

  compose-smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Record runner kernel
        run: uname -r
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra training
      - run: docker compose -f compose.yaml -f tests/integration/compose.uploads.yaml config --quiet
      - run: docker compose -f compose.yaml -f tests/integration/compose.uploads.yaml up --build --wait --wait-timeout 300
      - run: curl --fail http://127.0.0.1:8000/api/v1/health/ready
      - run: uv run --locked --extra training pytest -m "integration and not recovery" --junitxml=artifacts/test-reports/integration.xml
        env:
          MLPP_RUN_INTEGRATION: "1"
          MLPP_RUN_WORKER_INTEGRATION: "1"
      - run: uv run --locked --extra training pytest -m recovery --junitxml=artifacts/recovery-validation/junit.xml
        env:
          MLPP_RUN_RECOVERY_INTEGRATION: "1"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-integration-validation
          path: artifacts/test-reports/integration.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-validation
          path: artifacts/recovery-validation/
      - if: failure()
        run: docker compose -f compose.yaml -f tests/integration/compose.uploads.yaml logs
      - if: always()
        run: docker compose -f compose.yaml -f tests/integration/compose.uploads.yaml down
