x-app: &app
  image: ml-pipeline-pro:local
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    MLPP_ENVIRONMENT: development
    MLPP_LOG_LEVEL: ${MLPP_LOG_LEVEL:-INFO}
    MLPP_MONGODB_URI: mongodb://mongo:27017/?directConnection=true
    MLPP_MONGODB_DATABASE: ${MLPP_MONGODB_DATABASE:-ml_pipeline_pro}
    MLPP_REDIS_URL: redis://redis:6379/0
    MLPP_DEPENDENCY_TIMEOUT_SECONDS: ${MLPP_DEPENDENCY_TIMEOUT_SECONDS:-2}
    MLPP_ARTIFACT_ROOT: /app/artifacts
    MLPP_DATASET_ROOT: /app/examples/data
  volumes:
    - artifacts:/app/artifacts
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["celery", "-A", "ml_pipeline_pro.worker:app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=training,celery"]
    mem_limit: 1g
    cpus: 1.0

  scheduler:
    <<: *app
    command: ["celery", "-A", "ml_pipeline_pro.worker:app", "beat", "--loglevel=INFO", "--schedule=/tmp/mlpp-celerybeat"]

  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "mlpp", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status(); } catch (e) { if (e.code !== 94) throw e; rs.initiate({_id: 'mlpp', members: [{_id: 0, host: 'mongo:27017'}]}); } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  artifacts:
