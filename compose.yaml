services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLPP_ENVIRONMENT: development
      MLPP_LOG_LEVEL: ${MLPP_LOG_LEVEL:-INFO}
      MLPP_MONGODB_URI: mongodb://mongo:27017
      MLPP_MONGODB_DATABASE: ${MLPP_MONGODB_DATABASE:-ml_pipeline_pro}
      MLPP_REDIS_URL: redis://redis:6379/0
      MLPP_DEPENDENCY_TIMEOUT_SECONDS: ${MLPP_DEPENDENCY_TIMEOUT_SECONDS:-2}
      MLPP_ARTIFACT_ROOT: /app/artifacts
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  artifacts:
